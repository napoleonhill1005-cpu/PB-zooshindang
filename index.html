<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>주신당 강남점 PB 프렙 계산기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#14110f; --panel:#1d1916; --panel2:#26211d; --line:#3a322b;
  --ink:#f3ece3; --dim:#a89b8c; --faint:#6f6458;
  --gold:#d9a441; --gold2:#f0c46a; --red:#e0664f; --green:#7fb77e;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body,button,a,input,select,.tile,td.name{touch-action:manipulation}
button,a,.tile,td.name{-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
input,select{font-size:16px !important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:10;background:rgba(20,17,15,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top{max-width:980px;margin:0 auto;padding:14px 16px 10px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.brand{font-weight:900;letter-spacing:-.02em;font-size:18px;margin-right:auto}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--dim);letter-spacing:.08em}
.search{flex:1 1 220px;max-width:340px;position:relative}
.search input{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;outline:none}
.search input:focus{border-color:var(--gold)}
.bottle{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--dim);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:5px 8px}
.bottle input{width:62px;background:transparent;border:0;border-bottom:1px solid var(--faint);text-align:right;font-family:var(--mono);color:var(--gold2);outline:none}
.chips{max-width:980px;margin:0 auto;padding:0 16px 12px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--gold);border-color:var(--gold);color:#1a140d;font-weight:700}
.chip.guide{border-style:dashed;color:var(--dim)}
.chip.guide.on{color:#1a140d}
main{max-width:980px;margin:0 auto;padding:18px 16px 80px}
h1.cocktail{font-size:30px;font-weight:900;margin:4px 0 4px;letter-spacing:-.03em}
.sub{color:var(--dim);font-size:13px;margin-bottom:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;margin-bottom:18px;overflow:hidden}
.card-h{padding:16px 18px 12px;display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.card-h h2{margin:0;font-size:19px;font-weight:700}
.tag{display:inline-block;font-size:11px;color:var(--gold2);border:1px solid #5a4422;border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:2px;font-weight:500}
.modes{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:3px}
.modes button{background:none;border:0;padding:6px 11px;border-radius:7px;font-size:13px;color:var(--dim);cursor:pointer}
.modes button.on{background:var(--ink);color:#1a140d;font-weight:700}
.ctrl{padding:14px 18px;display:flex;flex-wrap:wrap;gap:14px 22px;align-items:center;background:#1a1613}
.qty{display:flex;align-items:center;gap:8px}
.qty{flex-wrap:wrap}
.qty label{font-size:13px;color:var(--dim);white-space:nowrap}
.qty .btn{white-space:nowrap}
.step{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel2)}
.step button{width:38px;height:40px;background:none;border:0;font-size:20px;cursor:pointer;color:var(--gold2)}
.step button:active{background:var(--line)}
.step input{width:84px;height:40px;text-align:center;background:transparent;border:0;border-left:1px solid var(--line);border-right:1px solid var(--line);font-family:var(--mono);font-size:18px;font-weight:700;outline:none}
.formula{font-family:var(--mono);font-size:12.5px;color:var(--dim);line-height:1.6}
.formula b{color:var(--gold2);font-weight:700}
table{width:100%;border-collapse:collapse}
th{font-size:11px;letter-spacing:.06em;color:var(--faint);font-weight:500;text-align:right;padding:9px 12px;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left;padding-left:18px}
th:last-child,td:last-child{padding-right:18px}
td{padding:11px 12px;border-bottom:1px solid #2c2621;text-align:right;vertical-align:middle;font-size:14px}
tr.done td{opacity:.38}
tr.done .amt{text-decoration:line-through}
td.name{font-weight:500;cursor:pointer}
td.name .x{display:block;font-size:11px;color:var(--faint);font-weight:400;margin-top:2px}
.ck{display:inline-block;width:18px;height:18px;border:1.5px solid var(--faint);border-radius:5px;margin-right:9px;vertical-align:-4px;position:relative}
tr.done .ck{background:var(--green);border-color:var(--green)}
tr.done .ck::after{content:'';position:absolute;left:5px;top:1px;width:5px;height:10px;border:solid #14110f;border-width:0 2px 2px 0;transform:rotate(45deg)}
.num{font-family:var(--mono);color:var(--dim);font-size:13px}
.amt{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--ink);white-space:nowrap}
.amt small{font-size:12px;color:var(--dim);font-weight:500;margin-left:2px}
.scale{display:block;font-size:10.5px;color:var(--faint);font-family:'Noto Sans KR';font-weight:400;margin-top:1px}
.scale.hi{color:var(--gold)}
tr.tot td{border-bottom:0;background:#221d19;font-weight:700}
tr.tot .amt{color:var(--gold2)}
.match{display:flex;align-items:center;gap:6px;justify-content:flex-end;margin-top:4px}
.match input{width:84px;background:var(--panel2);border:1px solid var(--gold);border-radius:7px;padding:4px 6px;text-align:right;font-family:var(--mono);font-size:13px;outline:none}
.match span{font-size:11px;color:var(--gold)}
.est{font-size:10.5px;color:var(--gold);display:block}
.body{padding:16px 18px 18px;display:grid;gap:14px}
.box h3{margin:0 0 6px;font-size:12px;letter-spacing:.08em;color:var(--faint);font-weight:500}
.box p{margin:0;white-space:pre-line;line-height:1.75;font-size:14px}
.box.note p{color:#e2d5c3}
.box.fix{background:#2a1c17;border:1px solid #5c3125;border-radius:10px;padding:12px 14px}
.box.fix h3{color:var(--red)}
.box.fix li{font-size:13px;line-height:1.6;color:#f0cfc4;margin-bottom:3px}
.box.fix ul{margin:0;padding-left:18px}
.xl{font-family:var(--mono);font-size:11.5px;color:var(--faint)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:7px 12px;font-size:13px;cursor:pointer;color:var(--dim)}
.btn:hover{border-color:var(--gold);color:var(--ink)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:#1a140d;padding:9px 16px;border-radius:10px;font-weight:700;font-size:14px;transition:.2s;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}
.guide-card{padding:20px 22px}
.guide-card h2{font-size:17px;margin:22px 0 8px;color:var(--gold2)}
.guide-card h2:first-child{margin-top:0}
.guide-card p{white-space:pre-line;line-height:1.85;font-size:14.5px;margin:0;color:#e2d5c3}
.guide-card .warn{margin-top:22px;padding:14px;border-radius:10px;background:#2a1c17;border:1px solid #5c3125}
.ico{display:inline-flex;align-items:center;justify-content:center;gap:5px;margin-left:8px;min-width:44px;height:38px;padding:0 10px;border-radius:10px;font-size:13px;font-weight:700;border:1px solid var(--line);background:var(--panel2);color:var(--dim);vertical-align:middle;text-decoration:none;cursor:pointer}
.ico.liq{color:var(--gold2);border-color:#5a4422;background:#2b2216}
.ico.prep{padding:0 10px;font-size:13px;color:var(--green);border-color:#3c5a3b;background:#1c261c}
.ico:active{transform:scale(.94)}
td.name .ico{display:flex;width:fit-content;margin:7px 0 0 27px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--dim);margin:-8px 0 16px;align-items:center}
.legend .ico{margin-left:0;margin-right:4px;pointer-events:none}
.flash{animation:fl 1.2s}
@keyframes fl{0%{box-shadow:0 0 0 2px var(--green)}100%{box-shadow:0 0 0 0 transparent}}
tr.hit td{background:#2b2416}
tr.hit td.name{color:var(--gold2)}
.card.hitcard{border-color:#7a5a24}
.cont{background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--ink);padding:7px 8px;font-size:13px}
.kg{display:block;font-family:var(--mono);font-size:11.5px;color:var(--gold);margin-top:1px}
.presets{display:flex;gap:6px;flex-wrap:wrap;flex-basis:100%}
.pre{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:12.5px;color:var(--dim);cursor:pointer;font-family:var(--mono)}
.pre.on{border-color:var(--gold);color:var(--gold2);background:#2b2216}
.bulk{display:inline-block;margin-left:6px;font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:6px;background:#2f4a2e;color:#bfe3bd;vertical-align:1px}
.chip.on .bulk{background:#1a140d;color:var(--gold2)}
.bulk.big{font-size:13px;padding:3px 9px;margin-left:10px;vertical-align:6px;font-weight:500}
.listbtn{background:var(--gold);color:#1a140d;border:0;border-radius:10px;padding:9px 12px;font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap}
.picker{max-width:980px;margin:0 auto;padding:16px 16px 0}
.pgroup{margin-bottom:14px}
.pgroup h4{margin:0 0 8px;font-size:11.5px;letter-spacing:.08em;color:var(--faint);font-weight:500}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tile{min-width:0}
.tile{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer;min-height:64px}
.tile b{display:block;font-size:17px;font-weight:700;letter-spacing:-.02em}
.tile small{display:block;font-size:11.5px;color:var(--dim);margin-top:3px;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.subt{background:#1b1f1a}
.tile.on{background:var(--gold);border-color:var(--gold);color:#1a140d}
.tile.on small{color:#4a3a20}
.tile.on .bulk{background:#1a140d;color:var(--gold2)}
.tile:active{transform:scale(.97)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:none;align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.sheet-in{background:var(--bg);border:1px solid var(--line);border-radius:18px 18px 0 0;width:100%;max-width:980px;max-height:82vh;overflow:auto;padding:16px 16px 28px}
.sheet-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:16px}
.fab{position:fixed;right:16px;bottom:18px;z-index:40;background:var(--gold);color:#1a140d;border:0;border-radius:999px;padding:12px 18px;font-weight:700;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.5);cursor:pointer;display:none}
.fab.on{display:block}
@media (max-width:640px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}.tile{padding:10px}.tile b{font-size:15.5px}.tile small{font-size:10.5px}.brand{order:1}.bottle{order:2}.search{order:3;flex:1 1 100%;max-width:none}.listbtn{order:2}}
.datebox{background:#1a2230;border:1px solid #2f3e57;border-radius:10px;padding:12px 14px}
.datebox h3{color:#9fb6dc}
.dl{display:flex;align-items:center;gap:12px}
.sticker{font-family:var(--mono);font-weight:700;font-size:18px;background:#f3ece3;color:#14110f;border-radius:6px;padding:6px 10px;white-space:nowrap;box-shadow:2px 2px 0 rgba(0,0,0,.4)}
.dl b{display:block;font-size:14px}
.dl span{display:block;font-size:12px;color:var(--dim);margin-top:2px}
.datebox .rule{font-size:11.5px;color:#7f93b5;margin-top:8px}
.pour{display:flex;align-items:center;gap:12px}
.pour b{display:block;font-size:16px}
.pour span{display:block;font-size:13px;color:var(--dim);margin-top:3px}
.bulkfix{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bulkfix b{background:#2f4a2e;color:#bfe3bd;border-radius:9px;padding:8px 12px;font-family:var(--mono);font-size:17px}
.bulkfix span{font-size:12.5px;color:var(--dim)}
.virgin{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px;background:#1f3550;color:#bcd6ff;margin-right:4px}
.tile.virg{background:#18202b}
.over{flex-basis:100%;background:#3a1d16;border:1px solid var(--red);color:#ffd2c6;border-radius:9px;padding:8px 12px;font-size:13px;font-weight:500}
.empty{color:var(--dim);padding:40px 0;text-align:center}
@media (max-width:640px){
  h1.cocktail{font-size:25px}
  .hide-m{display:none}
  td,th{padding-left:8px;padding-right:8px}
  .amt{font-size:18px}
}
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="brand">주신당 PB 프렙 계산기<small>PREP CALCULATOR @ 강남점</small></div>
    <div class="search"><input id="q" type="search" placeholder="검색 (오타·띄어쓰기 OK · 예: 치즈폼, 배일리스, ㅂㅇㄹㅅ)"></div>
    <button class="listbtn" id="listbtn" data-open="1"><span id="curname">쥐</span> ▾ 목록</button>
  </div>
</header>
<section class="picker" id="picker"></section>
<main id="main"></main>
<div class="sheet" id="sheet"><div class="sheet-in"><div class="sheet-h"><b>칵테일 선택</b><button class="btn" data-close="1">닫기</button></div><div id="sheetgrid"></div></div></div>
<button class="fab" id="fab" data-open="1">☰ 목록</button>
<div class="toast" id="toast"></div>
<script>
const DATA = {"groups": [{"name": "쥐", "preps": [{"name": "쥐 Prep", "mult": 6.0, "yf": 1, "xl": "=SUM(F3:F7)", "unit": "g", "method": "1. 모든 재료를 벌크용 컨테이너에 담는다. \n2. 스패츌러로 천천히, 모든 재료가 섞이도록 저어준다.\n3. 소분하여 냉장보관한다.", "notes": "* 론디아즈 151은 부패방지용으로 넣는다.\n* 생크림이 들어가는 칵테일이라 핸드 블렌더 사용시 고형이 될 가능성이 높다. 스패츌러로 휘핑되지 않도록 저어서 믹싱한다.", "fix": [], "ings": [{"n": "론디아즈 151", "a": 1.31, "u": "g", "t": true, "k": "normal"}, {"n": "베일리스 오리지널", "a": 27.48, "u": "g", "t": true, "k": "normal"}, {"n": "우유", "a": 19.3, "u": "g", "t": true, "k": "normal"}, {"n": "생크림", "a": 19.48, "u": "g", "t": true, "k": "normal"}, {"n": "누룽지 시럽", "a": 14.75, "u": "g", "t": true, "k": "normal"}]}, {"name": "누룽지 시럽", "mult": 1.0, "yf": 1, "xl": "=SUM(F9:F11)", "unit": "g", "method": "1. 누룽지와 물을 냄비에 넣고 화구에서 강한 불로 가열한다.\n2. 물이 팔팔 끓는 시점에서부터 5분동안 스패츌러로 저어가며 끓인다.\n3. 5분 뒤 누룽지를 걸러낸 후의 물과 동일한 무게의 백설탕을 넣고 스패츌러로 저어서 녹인다.", "notes": "* 누룽지 우린 물로 만드는 1:1 심플 시럽이라고 이해하면 쉽다.\n* 누룽지 우린 물은 굉장히 뜨겁기 때문에 2L 유리 비커 사용을 권장한다(플라스틱 사용시 환경호르몬 발생).", "fix": ["엑셀: 설탕 칸이 \"?\"라 총량이 #VALUE! 오류로 나옴 → 앱에선 \"걸러낸 누룽지물 무게\"를 입력하면 설탕이 1:1로 자동 계산됨", "엑셀 총량 수식(SUM F9:F11)이 걸러내는 누룽지까지 더하고 있었음 → 앱에선 누룽지 제외"], "ings": [{"n": "누룽지", "a": 12.1, "u": "g", "t": false, "k": "normal"}, {"n": "물", "a": 150.0, "u": "g", "t": true, "k": "normal"}, {"n": "큐원 하얀설탕", "a": null, "u": "g", "t": true, "k": "match"}]}, {"name": "쥐 치즈 폼", "mult": 23.0, "yf": 1, "xl": "=SUM(F13:F14)", "unit": "g", "method": "1. 플라스크에 우유와 치즈파우더를 계량하여 담는다. \n2. 핸드블렌더를 이용해 믹싱한 후 스퀴즈바틀에 담아 냉장보관한다.", "notes": "* 유제품이기 때문에 유통기한에 세심히 주의하여 보관 및 관리한다.\n* 반드시 우유에다 치즈파우더를 조금씩 부어가며 믹싱하도록 한다.\n* 텍스처가 너무 볼드해지지 않도록 플라스크를 기울여 거품이 없는 부분을 체크해가며 주의하여 블렌딩한다.", "fix": [], "ings": [{"n": "우유", "a": 28.86, "u": "g", "t": true, "k": "normal"}, {"n": "크림치즈 파우더", "a": 10.0, "u": "g", "t": true, "k": "normal"}]}]}, {"name": "소", "preps": [{"name": "소 Prep", "mult": 21.0, "yf": 1, "xl": "=SUM(F17:F20)", "unit": "g", "method": "1. 모든 재료를 벌크용 컨테이너에 담는다.\n2. 핸드블렌더로 블렌딩한 후 냉장보관한다.", "notes": "* 재료간 밀도차에 주의하여 블렌딩해준다       ${p.notes ? `<div class="box note"><h3>주의사항</h3><p>${esc(p.notes)}</p></div>` : ''}
      ${p.fix.length ? `<div class="box fix"><h3>엑셀 대비 수정·확인 사항</h3><ul>${p.fix.map(f => `<li>${esc(f)}</li>`).join('')}</ul></div>` : ''}
      <div class="actions"><button class="btn" data-k="${key}" data-act="copy">계량표 복사</button><button class="btn" data-k="${key}" data-act="reset">체크 초기화</button><span class="xl" style="align-self:center">엑셀 원본: 총량 수식 ${esc(p.xl)} · 기본 배수 ×${fmtMult(p.mult)} · 기본량 ${fmt(calc(p,{mode:'mult',mult:p.mult,strained:''}).finish,p.unit)}${p.unit}</span></div>
    </div></section>`;
}

function render() {
  renderChips();
  const m = document.getElementById('main');
  if (state.sel === '__guide') { m.innerHTML = renderGuide(); return; }
  const groups = DATA.groups.filter(matchesQ);
  if (!groups.length) { m.innerHTML = '<div class="empty">검색 결과가 없어</div>'; return; }
  const g = DATA.groups.find(x => x.name === state.sel) || groups[0];
  const n = g.preps.length;
  if (g.pour) { m.innerHTML = `<h1 class="cocktail">${esc(g.name)}</h1><div class="sub">${g.preps[0].how ? '걸러서 쓰는 재료' : '프렙 없이 붓기만 하는 재료'} · <b>${esc(g.parent)}</b> 칵테일에 사용</div>` + prepCard(g, g.preps[0], 0); return; }
  m.innerHTML = `<h1 class="cocktail">${esc(g.name)}${BULK_GROUPS.has(g.name) ? '<span class="bulk big">주로 벌크로 운용</span>' : ''}</h1><div class="sub">${g.virgin ? `<span class="virgin">논알콜</span> ${g.note}<br>` : g.sub ? (g.parent ? `<b>${esc(g.parent)}</b> 칵테일에 들어가는 부재료 · ` : '칵테일 공용 부재료 · ') : `프렙 ${n}개 · `} 병 수(병 종류 선택 가능) 또는 만들 g만 넣으면 재료별 양이 계산됨 · 재료를 탭하면 계량 완료 체크</div>
    <div class="legend"><span><span class="ico liq">${BOTTLE}</span>술 병 사진</span><span><span class="ico">${SEARCH}</span>제품 사진</span><span><span class="ico prep">↳ 레시피</span>직접 만드는 프렙으로 이동</span></div>` +
    g.preps.map((p, i) => prepCard(g, p, i)).join('');
}

function findPrep(key) {
  const [gn, i] = key.split('__');
  const g = DATA.groups.find(x => x.name === gn);
  return g.preps[+i];
}
function rerenderCard(key) {
  const [gn, i] = key.split('__');
  const g = DATA.groups.find(x => x.name === gn);
  const el = document.getElementById('c-' + key);
  const focused = document.activeElement;
  const f = focused && focused.dataset ? focused.dataset.f : null;
  const pos = focused && focused.selectionStart;
  const tmp = document.createElement('div');
  tmp.innerHTML = prepCard(g, g.preps[+i], +i);
  el.replaceWith(tmp.firstElementChild);
  if (f) { const ni = document.querySelector(`[data-k="${CSS.escape(key)}"][data-f="${f}"]`); if (ni) { ni.focus(); try { ni.setSelectionRange(pos, pos); } catch(e) {} } }
}

function toast(t) { const el = document.getElementById('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove('on'), 1600); }

document.addEventListener('click', e => {
  if (e.target.closest('a.ico')) return;
  const tu = e.target.closest('[data-tu]');
  if (tu) { const k = tu.dataset.k; ps(k, findPrep(k)).tunit = tu.dataset.tu; rerenderCard(k); return; }
  const pr = e.target.closest('[data-pre]');
  if (pr) { const k = pr.dataset.k; ps(k, findPrep(k)).target = +pr.dataset.pre; rerenderCard(k); return; }
  const jb = e.target.closest('[data-jump]');
  if (jb) {
    const here = [...document.querySelectorAll('main section.card')].find(sc => sc.dataset.pname && findPrep(jb.dataset.jump) && sc.dataset.pname === findPrep(jb.dataset.jump).name);
    if (here) { here.scrollIntoView({ behavior: 'smooth', block: 'start' }); here.classList.remove('flash'); void here.offsetWidth; here.classList.add('flash'); return; }
    const k = jb.dataset.jump, gname = k.split('__')[0];
    if (state.sel !== gname) { state.sel = gname; state.q = ''; document.getElementById('q').value = ''; render(); }
    const el = document.getElementById('c-' + k);
    if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'start' }); el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }
    return;
  }
  if (e.target.closest('[data-open]')) { renderChips(); document.getElementById('sheet').classList.add('on'); return; }
  if (e.target.closest('[data-close]') || e.target.id === 'sheet') { document.getElementById('sheet').classList.remove('on'); return; }
  const tileEl = e.target.closest('.tile');
  if (tileEl) {
    state.sel = tileEl.dataset.g; document.getElementById('sheet').classList.remove('on'); render();
    const m = document.getElementById('main'); const y = m.getBoundingClientRect().top + window.scrollY - document.querySelector('header').offsetHeight - 6;
    window.scrollTo({ top: y, behavior: 'smooth' }); return;
  }
  const mb = e.target.closest('[data-mode]');
  if (mb) { const k = mb.dataset.k; ps(k, findPrep(k)).mode = mb.dataset.mode; rerenderCard(k); return; }
  const nm = e.target.closest('td.name');
  if (nm) { const k = nm.dataset.k, s = ps(k, findPrep(k)); s.done[nm.dataset.i] = !s.done[nm.dataset.i]; rerenderCard(k); return; }
  const a = e.target.closest('[data-act]');
  if (!a) return;
  const k = a.dataset.k, p = findPrep(k), s = ps(k, p);
  if (a.dataset.act === 'inc' || a.dataset.act === 'dec') {
    const d = a.dataset.act === 'inc' ? 1 : -1;
    if (s.mode === 'bottle') s.bottles = Math.max(0, Math.round(+s.bottles || 0) + d);
    else if (s.mode === 'target') s.target = Math.max(0, Math.round(((+s.target || 0) + d * (s.tunit === 'kg' ? 100 : 50)) * 100) / 100);
    else s.mult = Math.max(0, Math.round(((+s.mult || 0) + d) * 1000) / 1000);
    rerenderCard(k);
  } else if (a.dataset.act === 'max') {
    if (s.mode === 'bottle') s.bottles = Math.floor(BULK_MAX / bsize(s)); else s.target = BULK_MAX;
    rerenderCard(k);
  } else if (a.dataset.act === 'reset') { s.done = {}; rerenderCard(k); }
  else if (a.dataset.act === 'copy') {
    const c = calc(p, s), u = p.unit;
    const head = s.mode === 'bulk' ? '벌크 3.5kg (3500g)' : s.mode === 'bottle' ? `${s.bottles}병 (${CONTAINERS[s.cont][0]} ${bsize(s)}${u})` : (u === 'g' && +s.target >= 1000 ? `${s.target / 1000}kg (${s.target}g)` : `${s.target}${u}`);
    const txt = `[${p.name}] ${head} (배수 ×${fmtMult(c.mult)})\n` + c.rows.map(r => `- ${r.n}: ${fmt(r.amt, r.u)}${r.u}${r.k === 'match' && r.estimated ? ' (예상, 걸러낸 무게와 1:1)' : ''}`).join('\n') + `\n= 총 ${fmt(c.finish, u)}${u}`;
    navigator.clipboard.writeText(txt).then(() => toast('복사됨')).catch(() => toast('복사가 막혀 있어. 길게 눌러 선택해줘'));
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'q') {
    state.q = t.value; render();
    clearTimeout(window._sq); window._sq = setTimeout(() => { const h = document.querySelector('.card.hitcard'); if (h && state.q.trim()) h.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 350);
    return;
  }
  if (t.dataset.f === 'targetIn') { const k = t.dataset.k, s = ps(k, findPrep(k)); const v = parseFloat(t.value); s.target = isNaN(v) ? '' : (s.tunit === 'kg' ? v * 1000 : v); rerenderCard(k); return; }
  if (t.dataset.f === 'bottles') { const k = t.dataset.k; const v = t.value === '' ? '' : Math.max(0, Math.round(parseFloat(t.value) || 0)); ps(k, findPrep(k)).bottles = v; rerenderCard(k); return; }
  if (t.dataset.f) { const k = t.dataset.k; ps(k, findPrep(k))[t.dataset.f] = t.value; rerenderCard(k); }
});
// 부재료(시럽·폼·인퓨전·주스)를 칵테일 밖에서도 따로 볼 수 있게 독립 항목으로 추가
(function addSubGroups() {
  const subs = [];
  DATA.groups.forEach(g => g.preps.forEach(p => {
    if (isMain(p)) return;
    subs.push({ name: p.name, preps: [p], sub: true, parent: g.name === '시트러스 주스' ? null : g.name });
  }));
  DATA.groups.push(...subs);
  // 논알콜(버진) 칵테일: 기존 프렙을 그대로 쓰므로 바로가기로 추가
  const findP = n => DATA.groups.flatMap(g => g.preps).find(p => p.name === n);
  [['버진 용', '용 인퓨젼', '용', '고든스 없이 <b>용 인퓨젼</b>만 프렙해두면 돼요 · 한 잔에 용 인퓨젼 95 + 프레쉬 레몬주스 15'],
   ['버진 양', '논알콜 양 Prep', '양', '<b>논알콜 양 Prep</b>(브로콜리 주스 + 오뚜기 메론 시럽) · 한 잔에 프렙 115 + 프레쉬 레몬주스 15']]
    .forEach(([name, pn, parent, note]) => { const pp = findP(pn); if (pp) DATA.groups.push({ name, virgin: true, parent, note, preps: [pp] }); });
  // 프렙 없이 그냥 붓기만 하는 재료
  const POUR = [['휘핑크림', '휘핑크림(서울우유)', '소', '서울우유 휘핑크림'], ['파인애플 주스', '돌 파인애플 주스', '쥐', '돌 파인애플 주스'], ['자몽주스', '나탈리스 자몽주스', '개', '나탈리스 자몽주스', '스트레이너로 과육을 걸러낸 뒤 사용 · 걸러낸 무게로 계량']];
  POUR.forEach(([name, product, parent, q, how]) => DATA.groups.push({ name, sub: true, pour: true, parent, preps: [{ name, pour: true, product, q, how, ings: [{ n: product }] }] }));
})();
window.addEventListener('scroll', () => {
  const pk = document.getElementById('picker');
  document.getElementById('fab').classList.toggle('on', pk.getBoundingClientRect().bottom < document.querySelector('header').offsetHeight + 10);
}, { passive: true });
render();
</script>
</body>
